# Replace yourdomain.com with the real domain, then enable this server block.
# DNS: create an A/CNAME record for mickys.yourdomain.com pointing to this host.
#
# This keeps the existing root website on yourdomain.com untouched and serves
# this CRM only from https://mickys.yourdomain.com.

server {
  listen 80;
  server_name mickys.yourdomain.com;

  # If SSL is managed by Certbot, it will usually replace this with HTTPS rules.
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name mickys.yourdomain.com;

  # Update these paths after issuing the certificate.
  ssl_certificate /etc/letsencrypt/live/mickys.yourdomain.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mickys.yourdomain.com/privkey.pem;

  root /var/www/mickys/client/dist;
  index index.html;

  client_max_body_size 15m;

  location /api/ {
    proxy_pass http://127.0.0.1:5000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://127.0.0.1:5000/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
